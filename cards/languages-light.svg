<svg
        width="400"
        height="145"
        viewBox="0 0 400 145"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
        role="img"
        aria-labelledby="descId"
      >
        <title id="titleId">Languages by byte size</title>
        <desc id="descId">Languages: TypeScript 52.29%, JavaScript 20.82%, Python 13.81%, HTML 7.23%, CSS 4.06%, Jupyter Notebook 1.79%</desc>
        <style>
          .header {
            font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #4a32a6;
            animation: fadeInAnimation 0.8s ease-in-out forwards;
          }
          @supports(-moz-appearance: auto) {
            .header { font-size: 15.5px; }
          }
          
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #1f2328;
    }
    @supports(-moz-appearance: auto) {
      .stat { font-size:12px; }
    }
    .bold { font-weight: 700 }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #1f2328;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    
    @keyframes fadeInAnimation {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    
          * { animation-duration: 0s !important; animation-delay: 0s !important; }
        </style>

        <rect
          data-testid="card-bg"
          class="card-bg"
          x="0.5"
          y="0.5"
          rx="4.5"
          height="99%"
          stroke="#e4e2e2"
          width="399"
          fill="#00000000"
          stroke-opacity="0"
        />

      <g
        data-testid="card-title"
        transform="translate(25, 35)"
      >
        <g transform="translate(0, 0)">
      <text
        x="0"
        y="0"
        class="header"
        data-testid="header"
      >Languages by byte size</text>
    </g>
      </g>

        <g
          data-testid="main-card-body"
          transform="translate(0, 55)"
        >
          
    <svg data-testid="lang-items" x="25">
      
      <mask id="rect-mask">
        <rect x="0" y="0" width="350" height="8" fill="white" rx="5"/>
      </mask>
        
      <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="0.0"
          y="0"
          width="183.0"
          height="8"
          fill="#3178c6"
        />
      <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="183.0"
          y="0"
          width="72.9"
          height="8"
          fill="#f1e05a"
        />
      <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="255.9"
          y="0"
          width="48.3"
          height="8"
          fill="#3572A5"
        />
      <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="304.2"
          y="0"
          width="25.3"
          height="8"
          fill="#e34c26"
        />
      <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="329.5"
          y="0"
          width="14.2"
          height="8"
          fill="#663399"
        />
      <rect
          mask="url(#rect-mask)"
          data-testid="lang-progress"
          x="343.7"
          y="0"
          width="6.3"
          height="8"
          fill="#DA5B0B"
        />
      
      <g transform="translate(0, 25)">
        <g transform="translate(0, 0)">
          
    <g transform="translate(0, 0)">
      <g class="stagger" style="animation-delay: 450ms">
        <circle cx="5" cy="6" r="5" fill="#3178c6" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">
          TypeScript 52.29%
        </text>
      </g>
    </g>
    <g transform="translate(0, 25)">
      <g class="stagger" style="animation-delay: 600ms">
        <circle cx="5" cy="6" r="5" fill="#3572A5" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">
          Python 13.81%
        </text>
      </g>
    </g>
    <g transform="translate(0, 50)">
      <g class="stagger" style="animation-delay: 750ms">
        <circle cx="5" cy="6" r="5" fill="#663399" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">
          CSS 4.06%
        </text>
      </g>
    </g>
        </g>
        <g transform="translate(160, 0)">
          
    <g transform="translate(0, 0)">
      <g class="stagger" style="animation-delay: 450ms">
        <circle cx="5" cy="6" r="5" fill="#f1e05a" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">
          JavaScript 20.82%
        </text>
      </g>
    </g>
    <g transform="translate(0, 25)">
      <g class="stagger" style="animation-delay: 600ms">
        <circle cx="5" cy="6" r="5" fill="#e34c26" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">
          HTML 7.23%
        </text>
      </g>
    </g>
    <g transform="translate(0, 50)">
      <g class="stagger" style="animation-delay: 750ms">
        <circle cx="5" cy="6" r="5" fill="#DA5B0B" />
        <text data-testid="lang-name" x="15" y="10" class="lang-name">
          Jupyter Notebook 1.79%
        </text>
      </g>
    </g>
        </g>
      </g>
  
    </svg>
  
        </g>
      </svg>
