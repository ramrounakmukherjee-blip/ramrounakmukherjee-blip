# Put this file in your PROFILE repository (the repo named exactly like your username)
# at .github/workflows/butterfly.yml
name: Update butterfly

on:
  schedule:
    - cron: "30 18 * * *" # every night at 00:00 India time (18:30 UTC)
  workflow_dispatch: # lets you press "Run workflow" to test it

permissions:
  contents: write

# One run at a time so a schedule + manual dispatch never race on the same push
concurrency: butterfly

jobs:
  butterfly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ramrounakmukherjee-blip/git-butterfly@51e4dece898f6152ba47b754253fdbf17a97b748
        with:
          username: ${{ github.repository_owner }}
          token: ${{ secrets.BUTTERFLY_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit the new butterfly
        run: |
          git config user.name "git-butterfly[bot]"
          git config user.email "git-butterfly@users.noreply.github.com"
          git add butterfly
          if ! git diff --cached --quiet; then
            git commit -m "chore: update butterfly"
            git pull --rebase origin main
            git push origin HEAD
          fi
