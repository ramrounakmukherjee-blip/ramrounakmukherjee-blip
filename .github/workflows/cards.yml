name: Cards

on:
  schedule:
    # Runs 20 minutes after the butterfly workflow so pushes never collide
    - cron: "50 18 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cards.yml
      - scripts/generate_cards.js

permissions:
  contents: write

concurrency: cards

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generate dynamic stats & language cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate_cards.js
      - name: Commit the cards if they changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          if git diff --cached --quiet; then
            echo "The cards are unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "cards: update stats and languages cards"
          git pull --rebase origin main
          git push
