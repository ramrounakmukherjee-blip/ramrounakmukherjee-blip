name: bonsai

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/bonsai.yml

permissions:
  contents: write

concurrency:
  group: bonsai-${{ github.ref }}
  cancel-in-progress: false

jobs:
  grow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: egorthinks/git-bonsai@665258cab3f304cfb33a96fc7bf108cec1f452f3
        with:
          user: ramrounakmukherjee-blip
